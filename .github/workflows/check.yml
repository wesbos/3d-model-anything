name: Check public release
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python3 tools/audit-public.py
      - run: npm ci
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install Pillow numpy
      - run: python3 .agents/skills/scan-to-threejs/scripts/test_house_import.py
      - run: python3 .agents/skills/scan-to-threejs/scripts/test_android_bundle.py
