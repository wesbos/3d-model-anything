name: HouseCapture
configs:
  Debug: debug
  Development: release
  Release: release
options:
  bundleIdPrefix: com.wesbos
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  xcodeVersion: "27.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  HouseCapture:
    type: application
    platform: iOS
    sources: [HouseCapture]
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.wesbos.housecapture
        APP_DISPLAY_NAME: 3D Model Anything
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
      configs:
        Debug:
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIconDev
          APP_DISPLAY_NAME: 3D Model Anything Debug
        Development:
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIconDev
          APP_DISPLAY_NAME: 3D Model Anything Dev
    info:
      path: HouseCapture/Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        NSCameraUsageDescription: 3D Model Anything uses the camera and LiDAR scanner to measure your rooms and take reference photos.
        # Non-LiDAR devices can import and review scans; capture is checked at runtime.
        ITSAppUsesNonExemptEncryption: false
        HouseCapturePrivacyURL: "https://wesbos.github.io/3d-model-anything/privacy.html"
        HouseCaptureSupportURL: "https://wesbos.github.io/3d-model-anything/support.html"
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen: {}
        # camera/AR app: no iPad split view, which also means portrait-only is allowed
        UIRequiresFullScreen: true
        UIStatusBarHidden: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
schemes:
  HouseCapture:
    build:
      targets:
        HouseCapture: all
    run:
      config: Release
    archive:
      config: Release
  HouseCaptureDev:
    build:
      targets:
        HouseCapture: all
    run:
      config: Development
    archive:
      config: Development
