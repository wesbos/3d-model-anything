name: HouseCapture
options:
  bundleIdPrefix: com.wesbos
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  xcodeVersion: "27.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  HouseCapture:
    type: application
    platform: iOS
    sources: [HouseCapture]
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.wesbos.housecapture
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
    info:
      path: HouseCapture/Info.plist
      properties:
        CFBundleDisplayName: 3D Model Anything
        NSCameraUsageDescription: 3D Model Anything uses the camera and LiDAR scanner to measure your rooms and take reference photos.
        NSLocationWhenInUseUsageDescription: 3D Model Anything uses your location while scanning to record true north for room and window directions. Your geographic coordinates are not saved.
        # Non-LiDAR devices can import and review scans; capture is checked at runtime.
        ITSAppUsesNonExemptEncryption: false
        HouseCapturePrivacyURL: "https://wesbos.github.io/3d-model-anything/privacy.html"
        HouseCaptureSupportURL: "https://wesbos.github.io/3d-model-anything/support.html"
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen: {}
        # camera/AR app: no iPad split view, which also means portrait-only is allowed
        UIRequiresFullScreen: true
        UIStatusBarHidden: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown]
